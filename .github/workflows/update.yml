# 放到仓库的 .github/workflows/update.yml
name: update-data

on:
  schedule:
    # 每天 13:07 UTC = 美东冬令时（EST，11 月至次年 3 月）早上 8:07 = 北京时间 21:07。
    # 避开整点（GitHub 在整点高峰会延迟甚至丢弃定时任务）。
    # GitHub 的 cron 只认 UTC：美东夏令时（EDT，3 月至 11 月）期间，13:07 UTC 是美东 9:07；
    # 想在夏令时也保持 8 点，把下面改成 "7 12 * * *"。
    - cron: "7 13 * * *"
  workflow_dispatch:         # 允许在网页上手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 fetch_edgar.py
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
