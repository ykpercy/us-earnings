# 放到仓库的 .github/workflows/update.yml
name: update-data

on:
  schedule:
    - cron: "0 11 * * *"   # 每天 11:00 UTC（北京时间 19:00，美东早晨 7 点）
  workflow_dispatch:         # 允许在网页上手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 fetch_edgar.py
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
